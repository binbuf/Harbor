name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Harbor.slnx

      - name: Test
        run: dotnet test Harbor.slnx --no-restore --configuration Release

      - name: Publish Harbor.Shell
        run: >
          dotnet publish src/Harbor.Shell/Harbor.Shell.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:VersionPrefix=${{ steps.version.outputs.version }}

      - name: Publish Harbor.Watchdog
        run: >
          dotnet publish src/Harbor.Watchdog/Harbor.Watchdog.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:VersionPrefix=${{ steps.version.outputs.version }}

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/Harbor-${{ steps.version.outputs.tag }}-win-x64.zip"

      - name: Build installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\Harbor.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Harbor ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/Harbor-${{ steps.version.outputs.tag }}-win-x64.zip
            artifacts/Harbor-${{ steps.version.outputs.tag }}-Setup.exe
